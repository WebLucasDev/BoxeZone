# Builds both installers and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Tags with a suffix (v1.2.0-rc.1) become pre-releases, which "latest" ignores.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Provider credentials
        shell: pwsh
        env:
          APPSETTINGS: ${{ secrets.APPSETTINGS_LOCAL_JSON }}
        run: |
          if (-not $env:APPSETTINGS) { throw "Secret APPSETTINGS_LOCAL_JSON is missing (Settings > Secrets and variables > Actions)." }
          [IO.File]::WriteAllText("$PWD/app/appsettings.local.json", $env:APPSETTINGS)

      # Pinned to the version used locally, so CI and local installers match. Upgrade: change
      # both values (winget show JRSoftware.InnoSetup --version X.Y.Z lists the URL and hash).
      - name: Inno Setup
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $env:INNO_URL -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw 'Inno Setup download does not match the pinned SHA256.' }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          # Without this check a failed install would fall back to whatever ISCC the runner has.
          if ($install.ExitCode -ne 0 -or -not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup install failed (exit code $($install.ExitCode))." }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      # The tag goes through env, never pasted into the script.
      - name: Build installers
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          ./app/installer/build.ps1 -Arch x64 -Version $version
          ./app/installer/build.ps1 -Arch arm64 -Version $version

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $files = (Get-ChildItem app/installer/output/*.exe).FullName
          $ghArgs = @($tag) + $files + @('--title', "Boxe Zone $($tag.TrimStart('v'))", '--generate-notes')
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
