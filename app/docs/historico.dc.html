<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Boxe Zone — histórico</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#e3e7ec}a:hover{color:#ffffff}
.cap{transition:background-color .1s ease,color .1s ease}
.cap:hover{background-color:rgba(255,255,255,.08)}
.cap-close:hover{background-color:#c42b1c;color:#ffffff}
.btn{transition:background-color .12s ease}
.btn:hover{background-color:rgba(255,255,255,.12)}
</style>
</helmet>
<div style="width: 880px; height: 520px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #1c2733; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: #f3f3f3">

<div aria-hidden="true" style="position: absolute; left: 380px; top: 200px; width: 460px; height: 460px; border-radius: 230px; background-color: #2f5d7c; filter: blur(30px); opacity: .7"></div>

<div style="position: absolute; left: 40px; top: 40px; display: flex; flex-direction: column; gap: 10px; max-width: 300px">
<div style="font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #9fb0c2">POC · Boxe Zone</div>
<div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-size: 28px; font-weight: 600; line-height: 1.2">Histórico</div>
<div style="font-size: 15px; line-height: 1.5; color: #c0cad6">Os últimos 50 envios, do mais novo para o mais antigo. Aberto pelo link "Histórico" no rodapé do widget; volta pela seta.</div>
</div>

<!-- Same container as Configurações: 440 px, header 36 px (Voltar · título · Fechar), padding 8/16/14. -->
<section style="position: absolute; left: 400px; top: 40px; width: 440px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); background-color: rgba(32,34,40,.72); box-shadow: 0 16px 40px rgba(0,0,0,.45)">
<header style="display: flex; align-items: center; height: 36px">
<button class="cap" aria-label="Voltar" style="width: 46px; height: 36px; border: 0; background: transparent; color: #e3e7ec">←</button>
<div style="flex-grow: 1; font-size: 12px; font-weight: 600">Histórico</div>
<button class="cap cap-close" aria-label="Fechar" style="width: 46px; height: 36px; border: 0; background: transparent; color: #e3e7ec">✕</button>
</header>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 16px 14px">

<!-- One card per batch: logo 28 px, title (file, folder or "N arquivos") + "Serviço · Hoje, 14:32", "Abrir", "Copiar link". The list scrolls past 440 px. -->
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,.08); background-color: rgba(255,255,255,.04)">
<div style="width: 28px; height: 28px; border-radius: 6px; background-color: rgba(255,255,255,.08)"></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Fotos da viagem</div>
<div style="font-size: 11px; color: #b3bcc8">Google Drive · Hoje, 14:32</div>
</div>
<span style="font-size: 12px; color: #b3bcc8">Abrir</span>
<span style="font-size: 12px; color: #b3bcc8">Copiar link</span>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,.08); background-color: rgba(255,255,255,.04)">
<div style="width: 28px; height: 28px; border-radius: 6px; background-color: rgba(255,255,255,.08)"></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">3 arquivos</div>
<div style="font-size: 11px; color: #b3bcc8">Dropbox · Ontem, 09:10</div>
</div>
<span style="font-size: 12px; color: #b3bcc8">Abrir</span>
<span style="font-size: 12px; color: #b3bcc8">Copiar link</span>
</div>

<!-- Empty: "Nenhum envio ainda." (12 px, secondary color) and no "Limpar histórico". -->
<div style="display: flex; justify-content: flex-end; margin-top: 4px">
<button class="btn" style="min-height: 28px; padding: 0 10px; border-radius: 4px; border: 0; background-color: transparent; color: #9fd8ff; font-family: inherit; font-size: 12px">Limpar histórico</button>
</div>
</div>
</section>
</div>
</x-dc>
</body>
</html>
