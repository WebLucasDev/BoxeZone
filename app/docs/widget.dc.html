<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Boxe Zone — POC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#9fd8ff}a:hover{color:#cfeaff}
@keyframes dzIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.zone{animation:dzIn .18s ease-out;transition:background-color .15s ease,border-color .15s ease}
.zone:hover{background-color:rgba(255,255,255,.07);border-color:rgba(255,255,255,.4)}
.ib{transition:background-color .12s ease}
.ib:hover{background-color:rgba(255,255,255,.08)}
.bar{transition:width .09s linear}
.cap{transition:background-color .1s ease,color .1s ease}
.cap:hover{background-color:rgba(255,255,255,.08)}
.cap-close:hover{background-color:#c42b1c;color:#ffffff}
.tab{transition:background-color .12s ease,border-color .12s ease}
.tab:hover span{background-color:rgba(255,255,255,.75)}
.strip{transition:width .15s ease}
.strip:hover{width:16px}
</style>
</helmet>
<div style="width: 880px; height: 680px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #1c2733; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: #f3f3f3">

<div aria-hidden="true" style="position: absolute; left: 470px; top: 250px; width: 420px; height: 420px; border-radius: 210px; background-color: #2f5d7c; filter: blur(30px); opacity: .7"></div>
<div aria-hidden="true" style="position: absolute; left: 640px; top: 120px; width: 260px; height: 260px; border-radius: 130px; background-color: #7a4f6a; filter: blur(40px); opacity: .55"></div>

<div style="position: absolute; left: 40px; top: 40px; display: flex; flex-direction: column; gap: 10px; max-width: 360px">
<div style="font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #9fb0c2">POC · Boxe Zone</div>
<div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-size: 28px; font-weight: 600; line-height: 1.2">Um destino por switch, uma prateleira por destino</div>
<div style="font-size: 15px; line-height: 1.5; color: #c0cad6">Ligue os provedores e clique numa área de drop para simular um envio.</div>
</div>

<sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 26px; bottom: 182px; font-size: 12px; color: #c0cad6">Clique na faixa para expandir</div>
<button class="strip" onClick="{{expand}}" aria-label="Expandir Boxe Zone" title="Expandir Boxe Zone" style="position: absolute; right: 0; bottom: 140px; width: 12px; height: 104px; border: 0; padding: 0; border-radius: 6px 0 0 6px; background-color: {{accent}}; box-shadow: 0 0 18px rgba(76,194,255,.35); cursor: pointer; display: flex; align-items: center; justify-content: center">
<span style="width: 2px; height: 28px; border-radius: 1px; background-color: rgba(15,18,22,.55)"></span>
</button>
</sc-if>

<sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
<button onClick="{{expand}}" style="position: absolute; right: 16px; bottom: 16px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background-color: rgba(32,34,40,.8); color: #e3e7ec; font-family: inherit; font-size: 12px; cursor: pointer">Rodando na bandeja · clique para reabrir</button>
</sc-if>

<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<section aria-label="Boxe Zone" style="position: absolute; right: 16px; bottom: 16px; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 8px; background-color: rgba(32,34,40,.72); backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 16px 40px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3)">

<button class="tab" onPointerDown="{{press}}" onPointerUp="{{release}}" onPointerLeave="{{cancel}}" aria-label="Recolher" title="Recolher" style="position: absolute; left: -15px; top: 50%; margin-top: -40px; width: 15px; height: 80px; padding: 0; border: 1px solid {{tabBorder}}; border-right: 0; border-radius: 8px 0 0 8px; background-color: {{tabBg}}; backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); box-shadow: -6px 0 16px rgba(0,0,0,.25); cursor: grab; display: flex; align-items: center; justify-content: center">
<span style="width: 3px; height: 26px; border-radius: 2px; background-color: {{tabLine}}"></span>
</button>

<header style="display: flex; align-items: center; gap: 8px; height: 36px; padding-left: 12px">
<div aria-hidden="true" style="width: 20px; height: 20px; border-radius: 5px; background-color: {{accent}}; color: #0f1216; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 256 256"><g transform="translate(-6 4) rotate(40 132 128)" fill="currentColor"><rect x="98" y="184" width="86" height="48" rx="12"></rect><path d="M104 172C98 150 96 128 98 108C100 56 126 26 162 28C194 30 210 60 206 100C202 136 192 156 178 172Z"></path><path d="M100 172C78 162 66 138 70 116C74 94 92 86 110 92C127 99 132 118 123 134C116 147 109 159 107 172Z" stroke="{{accent}}" stroke-width="16" stroke-linejoin="round"></path></g></svg>
</div>
<div style="font-size: 12px; font-weight: 600; flex-grow: 1">Boxe Zone</div>
<button class="cap" onClick="{{collapse}}" aria-label="Minimizar" title="Minimizar" style="width: 44px; height: 36px; border: 0; border-radius: 0; background-color: transparent; color: #e3e7ec; display: flex; align-items: center; justify-content: center; padding: 0; cursor: default">
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 5.5h10"></path></svg>
</button>
<button class="cap cap-close" onClick="{{hide}}" aria-label="Fechar" title="Fechar" style="width: 44px; height: 36px; border: 0; border-radius: 0 7px 0 0; background-color: transparent; color: #e3e7ec; display: flex; align-items: center; justify-content: center; padding: 0; cursor: default">
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0.5 0.5l9 9"></path><path d="M9.5 0.5l-9 9"></path></svg>
</button>
</header>

<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 6px 6px 6px">
<sc-for list="{{providers}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; border-radius: 6px; background-color: {{p.rowBg}}">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px">
<div aria-hidden="true" style="width: 28px; height: 28px; border-radius: 6px; background-color: rgba(255,255,255,.09); font-size: 12px; font-weight: 700; color: #eef1f5; display: flex; align-items: center; justify-content: center">{{p.initial}}</div>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<div style="font-size: 13px">{{p.name}}</div>
<div style="font-size: 11px; color: #b3bcc8">{{p.status}}</div>
</div>
<button aria-pressed="{{p.pressed}}" aria-label="{{p.label}}" onClick="{{p.toggle}}" style="position: relative; width: 40px; height: 20px; border-radius: 10px; border: 1px solid {{p.trackBorder}}; background-color: {{p.trackBg}}; cursor: pointer; padding: 0; flex-shrink: 0">
<span style="position: absolute; top: 3px; left: {{p.knobLeft}}; width: 12px; height: 12px; border-radius: 6px; background-color: {{p.knobBg}}; transition: left .15s ease"></span>
</button>
</div>

<sc-if value="{{p.on}}" hint-placeholder-val="{{ true }}">
<button class="zone" onClick="{{p.send}}" aria-label="{{p.zoneLabel}}" style="margin: 0 8px 8px 8px; min-height: 64px; box-sizing: border-box; padding: 10px 12px; border: 1px dashed rgba(255,255,255,.26); border-radius: 6px; background-color: rgba(255,255,255,.03); color: #e8edf3; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 6px; text-align: left">

<sc-if value="{{p.idle}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #cfd8e3">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5V2.5"></path><path d="M5 5.5l3-3 3 3"></path><path d="M2.5 10.5v3h11v-3"></path></svg>
<span style="font-size: 12px">Solte arquivos aqui</span>
</div>
</sc-if>

<sc-if value="{{p.uploading}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 1.5h5l3 3v10H4z"></path><path d="M9 1.5v3h3"></path></svg>
<span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.fileName}}</span>
<span style="color: #b3bcc8">{{p.pctLabel}}</span>
<span style="color: #b3bcc8">Cancelar</span>
</div>
<div style="height: 3px; border-radius: 2px; background-color: rgba(255,255,255,.12); overflow: hidden">
<div class="bar" style="height: 3px; width: {{p.pctWidth}}; background-color: {{accent}}"></div>
</div>
</sc-if>

<sc-if value="{{p.done}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px">
<div aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; background-color: {{accent}}; color: #0f1216; display: flex; align-items: center; justify-content: center">
<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"></path></svg>
</div>
<span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Enviado · {{p.fileName}}</span>
<span style="color: #b3bcc8">Abrir</span>
</div>
</sc-if>

</button>
</sc-if>
</div>
</sc-for>

<sc-if value="{{noneOn}}" hint-placeholder-val="{{ false }}">
<div style="padding: 6px 10px 10px 10px; font-size: 12px; color: #b3bcc8">Ative um destino para começar.</div>
</sc-if>
</div>

<footer style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: #b3bcc8">
<div style="display: flex; align-items: center; gap: 6px">
<span style="padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,.18); color: #dbe1e8">Ctrl+Alt+D</span>
<span>abre e fecha</span>
</div>
<a href="Configuracoes.dc.html">Configurações</a>
</footer>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4CC2FF","options":["#4CC2FF","#60CDBA","#F7A35C"]},"$preview":{"width":880,"height":680}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { drive: true, onedrive: true, dropbox: false }, up: {}, mode: 'open' };
    this._timers = {};
  }
  componentWillUnmount() {
    var t = this._timers;
    Object.keys(t).forEach(function (k) { clearInterval(t[k]); });
  }
  startUpload(id) {
    var self = this;
    var cur = this.state.up[id];
    if (cur && cur.pct < 100) return;
    var files = { drive: 'apresentacao-q3.pptx', onedrive: 'planilha-custos.xlsx', dropbox: 'fotos-evento.zip' };
    var up = Object.assign({}, this.state.up);
    up[id] = { pct: 0, file: files[id] };
    this.setState({ up: up });
    clearInterval(this._timers[id]);
    this._timers[id] = setInterval(function () {
      var u = self.state.up[id];
      if (!u) { clearInterval(self._timers[id]); return; }
      var next = Math.min(100, u.pct + 4 + Math.round(Math.random() * 6));
      var nu = Object.assign({}, self.state.up);
      nu[id] = { pct: next, file: u.file };
      self.setState({ up: nu });
      if (next >= 100) clearInterval(self._timers[id]);
    }, 90);
  }
  renderVals() {
    var accent = this.props.accent ?? '#4CC2FF';
    var self = this;
    var on = this.state.on;
    var upAll = this.state.up;
    var base = [
      { id: 'drive', name: 'Google Drive', initial: 'G' },
      { id: 'onedrive', name: 'OneDrive', initial: 'O' },
      { id: 'dropbox', name: 'Dropbox', initial: 'D' }
    ];
    var providers = base.map(function (p) {
      var isOn = !!on[p.id];
      var u = upAll[p.id];
      var uploading = !!(u && u.pct < 100);
      var done = !!(u && u.pct >= 100);
      return {
        id: p.id, name: p.name, initial: p.initial, on: isOn,
        idle: !u, uploading: uploading, done: done,
        fileName: u ? u.file : '',
        pctLabel: u ? u.pct + '%' : '',
        pctWidth: u ? u.pct + '%' : '0%',
        status: !isOn ? 'Desligado' : (uploading ? 'Enviando…' : 'Pronto'),
        rowBg: isOn ? 'rgba(255,255,255,.04)' : 'transparent',
        pressed: isOn ? 'true' : 'false',
        label: (isOn ? 'Desativar ' : 'Ativar ') + p.name,
        zoneLabel: 'Área de drop do ' + p.name + ' — clique para simular um envio',
        trackBg: isOn ? accent : 'transparent',
        trackBorder: isOn ? accent : 'rgba(255,255,255,.6)',
        knobBg: isOn ? '#0f1216' : '#d7dbe1',
        knobLeft: isOn ? '23px' : '3px',
        toggle: function () {
          var next = Object.assign({}, self.state.on);
          next[p.id] = !next[p.id];
          self.setState({ on: next });
        },
        send: function () { self.startUpload(p.id); }
      };
    });
    var n = providers.filter(function (p) { return p.on; }).length;
    var mode = this.state.mode;
    var pressing = !!this.state.pressing;
    return {
      tabBg: pressing ? accent : 'rgba(32,34,40,.72)',
      tabBorder: pressing ? accent : 'rgba(255,255,255,.12)',
      tabLine: pressing ? 'rgba(15,18,22,.6)' : 'rgba(255,255,255,.4)',
      press: function () { self.setState({ pressing: true }); },
      cancel: function () { if (self.state.pressing) self.setState({ pressing: false }); },
      release: function () {
        if (!self.state.pressing) return;
        setTimeout(function () { self.setState({ pressing: false, mode: 'collapsed' }); }, 180);
      },
      accent: accent, providers: providers, noneOn: n === 0,
      open: mode === 'open', collapsed: mode === 'collapsed', hidden: mode === 'hidden',
      collapse: function () { self.setState({ mode: 'collapsed' }); },
      hide: function () { self.setState({ mode: 'hidden' }); },
      expand: function () { self.setState({ mode: 'open' }); }
    };
  }
}
</script>
</body>
</html>
